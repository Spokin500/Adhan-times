name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Projede gradlew / gradle-wrapper.jar yok; bu yüzden Gradle'ı doğrudan kuruyoruz.
      # Sürüm gradle-wrapper.properties ile aynı (9.3.1).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      # ubuntu-latest'te Android SDK hazır geliyor (ANDROID_HOME). Sadece lisansları
      # kabul edip projenin istediği platformu (compileSdk 36.1) kuruyoruz.
      - name: Prepare Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36.1" "build-tools;36.0.0" || "$SDKM" "platforms;android-36" "build-tools;36.0.0"

      # app/build.gradle.kts, kökte debug.keystore bekliyor ama .gitignore'da olduğu için repoda yok.
      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Prepare .env
        run: cp .env.example .env

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: adhan-times-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

