name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Projede gradlew / gradle-wrapper.jar yok; bu yüzden Gradle'ı doğrudan kuruyoruz.
      # Sürüm gradle-wrapper.properties ile aynı (9.3.1).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      # ubuntu-latest'te Android SDK hazır geliyor. sdkmanager'a hiç dokunmuyoruz:
      # sadece lisansları kabul edilmiş say, eksik platform/build-tools'u AGP kendisi indirir.
      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      # app/build.gradle.kts, kökte debug.keystore bekliyor ama .gitignore'da olduğu için repoda yok.
      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Prepare .env
        run: cp .env.example .env

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --no-configuration-cache

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: adhan-times-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
